[build-system]
# 77 is the floor for the PEP 639 license fields used below. Older setuptools
# rejects `license` as a plain SPDX string; newer setuptools rejects the
# `{text = ...}` table it replaced, so the two forms cannot both be supported.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "easipass"
version = "0.1.0"
description = "Automated image processing pipeline for 2-photon microscopy and HCR confocal imaging"
readme = "README.MD"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["two-photon", "HCR", "FISH", "image-registration", "segmentation", "neuroscience"]

authors = [
    {name = "Jonna Singh", email = "jsinghal@bidmc.harvard.edu"},
    {name = "Oren Amsalem", email = "oren.a4@gmail.com"},
]


# Core dependencies — needed for the main pipeline (master_pipeline.py + src/)
dependencies = [
    # Scientific stack
    # cellpose 4 (cellpose-SAM) runs on the numpy 2.x line. The cap is a major
    # version, not a tested ceiling: it only stops a resolver from silently
    # crossing into a numpy 3 that nothing here has ever been run against.
    "numpy>=1.26,<3",
    "scipy>=1.9",
    "pandas>=2.0",
    "scikit-image>=0.21",

    # Image I/O
    "tifffile>=2022.10",
    "imagecodecs",
    "imageio",
    "pillow",
    # Both opencv distributions end up installed and both provide `cv2`:
    # bigstream requires `opencv-python`, cellpose and suite2p require
    # `opencv-python-headless`. They must therefore be held to the same major,
    # or whichever unpacks last decides which `cv2` you get. headless is listed
    # here only to pin it; nothing calls a GUI function (the sole use of cv2 in
    # this package is `cv2.estimateAffine3D`).
    "opencv-python>=4.10,<5",
    "opencv-python-headless>=4.10,<5",

    # Registration
    "SimpleITK==2.3.1",

    # Segmentation — cellpose 4 (cellpose-SAM / cpsam) is the assumed backend
    "cellpose>=4.0",

    # PyTorch, declared so that there is exactly one source of it. It used to
    # arrive twice: once from the conda `pytorch` channel via environment.yml,
    # and again as an undeclared transitive of cellpose and suite2p. The Linux
    # wheels on PyPI bundle CUDA, so conda is not needed for GPU support.
    # For a CPU-only box, install from the CPU index instead — see the README.
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",

    # Visualization (used in core pipeline for QC outputs)
    "matplotlib>=3.9",

    # Config & I/O
    "hjson",
    "pyyaml",
    "zarr>=2.12,<3",  # bigstream uses `from zarr import blosc`, removed in zarr 3
    "h5py>=3.8",
    # zarr 2.18 itself requires numcodecs<0.16. Leaving this uncapped is what
    # sends pip backtracking: it takes numcodecs 0.16 first, discovers the
    # conflict, then walks back down the zarr and numcodecs releases, building
    # C extensions from sdists as it goes.
    "numcodecs>=0.9,<0.16",
    "pydantic>=2.7",
    "flatten_json",

    # CLI & output
    "tqdm",
    "rich",
    "natsort",
    "joblib",

    # Fast remapping for segmentation masks
    "fastremap>=1.15",

    # 2-photon ingest. Imported at module scope by easipass/functional.py,
    # easipass/tiling.py and easipass/segmentation.py, so they are required even
    # for the TIFF-only path that never reads a ScanBox file.
    "suite2p>=0.14.4",
    "sbxreader>=0.2.2",
    "pystackreg>=0.2.7",

    # BigStream registration. easipass/bigstream_functions.py and
    # easipass/registrations.py import these at module scope; the remaining
    # entries are transitive deps the pinned fork does not declare itself.
    "bigstream @ git+https://github.com/orena1/bigstream.git@b35f4eabbfaf0d96fd66023a07a5106c173b368c",
    "ClusterWrap @ git+https://github.com/GFleishman/ClusterWrap.git@fa718ac49e55f813e913af043d107ecb32663cbb",
    "fishspot>=0.3",
    "morphsnakes>=2.0",
    "pynrrd>=1.0",
    "dask>=2023.10",
    "distributed>=2023.10",
    "dask-jobqueue>=0.9",
    "numba>=0.60",

    # Gaussian mixture gate in easipass/somaprint.py and somaprint_hcr.py.
    "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/orena1/easi-pass"
Repository = "https://github.com/orena1/easi-pass"
Issues = "https://github.com/orena1/easi-pass/issues"

[project.optional-dependencies]

# Interactive notebooks (HCR-HCR registration, analysis, figures)
notebooks = [
    "jupyterlab>=4.3",
    "ipykernel",
    "ipympl>=0.9",
    "ipywidgets>=8.1",
    "seaborn>=0.13",
    "plotly>=5.0",
]

# Analysis notebooks (dimensionality reduction, statistics, ML)
analysis = [
    "umap-learn>=0.5.6",
    "xgboost>=2.1",
    "statsmodels>=0.14",
]

# Everything
all = [
    "easipass[notebooks,analysis]",
]

[project.scripts]
easipass = "master_pipeline:main"

[tool.setuptools]
py-modules = ["master_pipeline"]

[tool.setuptools.packages.find]
include = ["easipass*"]
