# EASI-PASS — conda environment
#
# Only what has to come from conda channels: Python and CUDA-enabled PyTorch.
# Everything else is a pip dependency declared in pyproject.toml.
#
#   conda env create -f environment.yml
#   conda activate easipass
#   pip install -e .

name: easipass

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.12

  # PyTorch with CUDA (not reliably pip-installable with GPU support)
  - pytorch::pytorch=2.5
  - pytorch::torchvision
  - pytorch::pytorch-cuda=12.1

  # pip (for installing the package itself)
  - pip
