# EASI-PASS — conda environment. The fallback route; the README's uv route is
# the recommended one and needs no conda.
#
# This file supplies Python and nothing else. Every dependency, PyTorch
# included, is pinned in requirements.txt.
#
#   conda env create -f environment.yml
#   conda activate easipass
#   pip install -e . -c requirements.txt
#
# If `Collecting package metadata` takes a long time, that is conda indexing all
# of conda-forge and is not specific to this project. Use miniforge and check
# `conda config --show solver` reports libmamba, or use uv instead.

name: easipass

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
